name: Minecraft 1.21.1 migration build

on:
  push:
    branches:
      - 1.21.1-fabric-port
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Apply source migration
        run: python .github/port_1211.py
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Build
        run: ./gradlew build --stacktrace --warning-mode all
      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blockbuster-1.21.1-build
          path: |
            build/libs/*.jar
            build/reports/**
          if-no-files-found: ignore
