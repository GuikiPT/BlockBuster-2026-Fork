# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.16.14

# Mod Properties
# Distribution version of the full port. NOTE: this is the mod *release*
# version (fabric.mod.json + jar filename), deliberately distinct from the
# in-code Blockbuster.VERSION constant which stays "2.7.2" so version-embedding
# outputs (OBJ/MTL export headers, P74) remain byte-identical to files produced
# by Blockbuster 2.7.2. See blockbuster-fabric/ATTRIBUTION.md / README.md.
mod_version=2.7.2
maven_group=mchorse
archives_base_name=blockbuster

# Dependencies
fabric_version=0.92.1+1.20.1

# S21 P218 — the single pinned Iris build the shader-curve mixins are compiled
# and tested against (`modClientCompileOnly`, never shipped, never on the test
# classpath). Iris internals have no stability guarantee, so this is one exact
# version rather than a range: `maven.modrinth:iris:1.7.0+1.20.1`, whose file is
# `iris-1.7.0+mc1.20.1.jar` — the same Iris line as the 1.20.4 branch (package
# root `net.irisshaders.iris`), so the pinned internals are unchanged.
# Bumping this requires re-checking IrisMixinPlugin.PINNED_CLASSES and
# ShaderCurveBridge's javadoc name table; nothing else in the build cares.
iris_version=1.7.0+1.20.1
